
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resume Architect - High-Fidelity CV Builder">
    <title>Resume Architect | Professional CV Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#FAFAFA',
              foreground: '#0F172A',
              accent: {
                DEFAULT: '#0052FF',
                secondary: '#4D7CFF',
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['Calistoga', 'serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
        :root {
            --print-width: 210mm;
            --print-height: 297mm;
        }
        body {
            background-color: #FAFAFA;
            color: #0F172A;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .resume-container {
            width: var(--print-width);
            min-height: var(--print-height);
            background: white;
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.1);
            padding: 20mm;
            flex-shrink: 0;
            position: relative;
        }
        .avoid-break {
            break-inside: avoid;
            page-break-inside: avoid;
        }
    </style>
</head>
<body class="antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
